name: 테스트

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 단위 테스트
        run: node --test tests/*.test.mjs
      - name: 진행 속도 시뮬레이션(요약)
        run: node tools/simulate.mjs 20 | grep -E "^\| |첫 복권|총 시간"
